<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Beyond POC — Applied AI, with evidence.</title>
  <desc id="desc">Damon Carr's independent engineering work in voice, agentic systems, and verification. A diagram connects intent, build, and verify.</desc>
